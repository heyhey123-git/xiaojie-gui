name: Build

# Everything the build reads. `gradle/` and `server-test/` are in the list because both change what a
# green run means: a dependency bump or an edited self-test script has to be verified like code does.
on:
  push:
    paths:
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - src/**
      - server-test/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - src/**
      - server-test/**
      - .github/workflows/build.yml

# A second push to the same branch makes the first run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # JDK 25, not 21: Paper 26.2 is compiled for it and `build.gradle.kts` asks the toolchain for it.
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build, lint and run the unit tests
        run: ./gradlew build --stacktrace

      # The one layer that sees registration and parse failures: it boots a real Paper server with Skript
      # and reads the log afterwards. The first run downloads Paper, Skript, PacketEvents and SkBee.
      - name: Run the server test
        run: ./gradlew serverTest --stacktrace

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: xiaojiegui-${{ github.sha }}
          include-hidden-files: true
          path: build/dist/
