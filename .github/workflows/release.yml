name: Release

# Manual, and only from the default branch: the tag it creates points at the commit this run built and
# tested, so a release cannot name a commit that was never verified.
#
# The version is read from `gradle.properties` rather than typed in, and the notes come from CHANGELOG.md,
# so a release cannot go out undescribed or under a version nobody wrote down.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Checked before the build rather than after it: a release with no version, no notes or an existing
      # tag should fail in seconds, not in two minutes.
      - name: Read and check the version
        timeout-minutes: 1
        id: version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r' | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::gradle.properties declares no version."
            exit 1
          fi
          if [[ "$version" == *SNAPSHOT* ]]; then
            echo "::error::gradle.properties still says '$version'. Set the release version (for example 2.0.0), push that, and run this again."
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a plain release version such as 2.0.0."
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::release v$version already exists."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "::error::tag v$version already exists."
            exit 1
          fi
          if ! grep -q "^## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section. Write what this release changes first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build, lint and run the unit tests
        timeout-minutes: 23
        run: ./gradlew clean build --stacktrace --info --profile --console=plain

      # Same allowlist/key as build.yml; no worlds, player state, scripts, test jar or logs.
      - name: Restore server downloads
        id: server-cache
        uses: actions/cache/restore@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            server-test/run/versions
            server-test/run/libraries
            server-test/run/cache
            server-test/run/plugins/Skript-2.16.2.jar
            server-test/run/plugins/packetevents-spigot-2.13.0.jar
            server-test/run/plugins/SkBee-3.25.4.jar
          key: test-server-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', 'build.gradle.kts') }}

      - name: Run the server test
        id: server-test
        timeout-minutes: 10
        run: ./gradlew serverTest --stacktrace --info --profile --console=plain

      - name: Save server downloads
        if: steps.server-test.outcome == 'success' && steps.server-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            server-test/run/versions
            server-test/run/libraries
            server-test/run/cache
            server-test/run/plugins/Skript-2.16.2.jar
            server-test/run/plugins/packetevents-spigot-2.13.0.jar
            server-test/run/plugins/SkBee-3.25.4.jar
          key: ${{ steps.server-cache.outputs.cache-primary-key }}

      # Restore AFTER clean, which deletes these build-local downloads.
      - name: Restore client downloads
        id: client-cache
        uses: actions/cache/restore@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            build/client-test-plugins/ViaVersion-5.12.0.jar
            build/client-test-plugins/ViaBackwards-5.12.0.jar
            build/client-test/npm-cache/_cacache
          key: test-client-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.gradle.kts', 'server-test/client/package.json', 'server-test/client/package-lock.json') }}

      # Node ships on ubuntu-latest; the task recreates node_modules with npm ci.
      - name: Run the client test
        id: client-test
        timeout-minutes: 12
        run: ./gradlew clientTest --stacktrace --info --profile --console=plain

      - name: Save client downloads
        if: steps.client-test.outcome == 'success' && steps.client-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            build/client-test-plugins/ViaVersion-5.12.0.jar
            build/client-test-plugins/ViaBackwards-5.12.0.jar
            build/client-test/npm-cache/_cacache
          key: ${{ steps.client-cache.outputs.cache-primary-key }}

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/reports/
            build/test-results/
            build/client-test/*.log
            server-test/run/logs/
            server-test/run/crash-reports/

      # Keep user-home logs separate so the main artifact stays relative to the project.
      - name: Upload Gradle daemon logs
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: release-gradle-daemon-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: ${{ env.GRADLE_USER_HOME }}/daemon/*/daemon-*.out.log

      - name: Check the jar agrees with the version
        run: |
          jar="build/dist/xiaojiegui-${{ steps.version.outputs.version }}.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::no $jar was produced, so the jar and gradle.properties disagree."
            ls -l build/dist
            exit 1
          fi
          sha256sum "$jar" | tee "$jar.sha256"

      # One extraction for the release page and for correcting it later:
      # `./gradlew releaseNotes` then `gh release edit v<version> --notes-file build/release-notes.md`.
      - name: Write the release notes
        timeout-minutes: 1
        run: ./gradlew releaseNotes --stacktrace

      - name: Publish the release
        timeout-minutes: 1
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "build/dist/xiaojiegui-${{ steps.version.outputs.version }}.jar" \
            "build/dist/xiaojiegui-${{ steps.version.outputs.version }}.jar.sha256" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file build/release-notes.md

      - name: Summarize
        run: |
          {
            echo "### Released v${{ steps.version.outputs.version }}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Jar | \`xiaojiegui-${{ steps.version.outputs.version }}.jar\` |"
            echo "| Release | https://github.com/$GITHUB_REPOSITORY/releases/tag/v${{ steps.version.outputs.version }} |"
          } >> "$GITHUB_STEP_SUMMARY"
